<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Link previews (LinkedIn, Slack, iMessage...) read this static text
       without running JavaScript, so it is written out here. main.js still
       sets the tab title from SETTINGS. Keep these in step with content.js. -->
  <title>Cam Carr</title>
  <meta name="description" content="Cam Carr (Cameron Carr): Vanderbilt '26 history honors grad, pursuing questions of human flourishing in a world increasingly shaped by AI. A zoomable map of a life.">
  <link rel="canonical" href="https://cameroncarr-likesfish.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cameroncarr-likesfish.github.io/">
  <meta property="og:title" content="Cam Carr">
  <meta property="og:description" content="Vanderbilt '26 history honors grad, pursuing questions of human flourishing in a world increasingly shaped by AI. A zoomable map of a life.">
  <meta property="og:image" content="https://cameroncarr-likesfish.github.io/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Cam Carr: a small figure on Earth's horizon under a night sky">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#050814">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050814'/%3E%3Cpath d='M16 5 L18.2 13.8 L27 16 L18.2 18.2 L16 27 L13.8 18.2 L5 16 L13.8 13.8 Z' fill='%23e3a9b3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="geo.js" defer></script>
  <script src="cosmos.js" defer></script>
  <script src="starfield.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <!-- Visual layers. Everything below is positioned with CSS, so the order
       here is the keyboard and screen-reader order: header, map,
       timeline, zoom, then the item panel. -->
  <canvas id="sky" aria-hidden="true"></canvas>

  <header class="site-header">
    <h1 class="identity">
      <span class="identity__name"></span>
      <span class="identity__pronouns"></span>
    </h1>
    <p class="identity__full"></p>
    <p class="identity__tagline"></p>
    <p class="identity__seeking"></p>
    <p class="identity__availability"></p>
    <ul class="contact" aria-label="Contact"></ul>
  </header>

  <!-- A plain resume, for visitors who'd rather not zoom. Shown in Now,
       with the rest of the present-day header. -->
  <a class="resume-link" href="resume.html"></a>

  <div class="position">
    <div role="status" aria-live="polite">
      <span class="position__label">You are in</span>
      <span class="position__era"></span>
      <span class="position__sub"></span>
    </div>
    <p class="position__sky"></p>
  </div>

  <main id="stage" aria-label="Map of eras">
    <!-- The eras live in #world, which zooms toward an item for a sub-zoom. -->
    <div id="world"></div>
  </main>

  <!-- A sub-zoom: an item's own small sky (e.g. coursework). Filled from
       DETAILS in content.js. -->
  <section class="detail" id="detail" aria-labelledby="detail-title" inert>
    <div class="detail__scroll" data-scrollable>
    <div class="detail__inner">
      <button type="button" class="btn detail__back"></button>
      <h2 class="detail__title" id="detail-title" tabindex="-1"></h2>
      <p class="detail__subtitle"></p>
      <ul class="detail__stats"></ul>
      <div class="detail__groups"></div>
    </div>
    </div>
  </section>

  <!-- A small figure looking up at the sky. It shrinks as the view moves
       toward the future: close in the past, tiny under the open sky. -->
  <div class="figure" aria-hidden="true">
    <span class="figure__ground"></span>
    <svg class="figure__svg" viewBox="0 0 40 100" focusable="false">
      <path d="M18.6 14.6 L18.4 19.5 C15 20 12.5 21 11.6 24 L10.4 50 Q10.5 53 12.2 53 L13.4 31 L14.2 56 L15.2 97 L19.6 97 L20.4 63 L21.2 97 L25.6 97 L26.6 56 L27.4 31 L28.4 53 Q30.2 53 30.2 50 L29.2 24 C28.4 21 26 20 23.2 19.5 L23.4 14.6 Z"/>
      <ellipse cx="21.6" cy="9.6" rx="5.6" ry="7.1" transform="rotate(-40 21.6 9.6)"/>
    </svg>
  </div>

  <nav class="era-nav" aria-label="Eras">
    <span class="era-nav__track" aria-hidden="true"><span class="era-nav__marker"></span></span>
    <ol class="era-nav__list"></ol>
  </nav>

  <!-- First-visit hint beside the zoom buttons; gone after the first zoom. -->
  <p class="zoom-hint" hidden></p>

  <div class="zoom-controls" role="group" aria-label="Zoom">
    <button type="button" class="zoom-btn" data-zoom="in" aria-label="Zoom in, back in time" title="Zoom in: back in time">+</button>
    <button type="button" class="zoom-btn" data-zoom="out" aria-label="Zoom out, forward in time" title="Zoom out: forward in time">&minus;</button>
  </div>

  <aside class="panel" id="panel" aria-labelledby="panel-title" hidden data-scrollable>
    <button type="button" class="panel__close" aria-label="Close panel">&times;</button>
    <p class="panel__era"></p>
    <p class="panel__parent"></p>
    <h2 class="panel__title" id="panel-title" tabindex="-1"></h2>
    <p class="panel__summary"></p>
    <div class="panel__body"></div>
    <ul class="panel__links" aria-label="Links"></ul>
    <div class="panel__children"></div>
    <button type="button" class="btn panel__back"></button>
  </aside>

  <dialog class="wall" aria-labelledby="wall-title" aria-describedby="wall-note">
    <h2 class="wall__title" id="wall-title"></h2>
    <div class="wall__note" id="wall-note"></div>
    <p class="wall__text"></p>
    <div class="wall__actions">
      <button type="button" class="btn btn--primary" data-wall="yes"></button>
      <button type="button" class="btn" data-wall="no"></button>
    </div>
  </dialog>

  <!-- The one-line opening, shown once per visit (UI_TEXT.openingLine). -->
  <div class="opening" role="status" aria-live="polite" hidden>
    <p class="opening__line"></p>
  </div>

  <noscript><p class="noscript">This site needs JavaScript to run.</p></noscript>
</body>
</html>
